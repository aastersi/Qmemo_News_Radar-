# Скопируйте в sources.yaml. После изменений: docker compose restart radar
#
# X — платный источник: читается только при RADAR_PAID_SOURCES_ENABLED=true и
# RADAR_X_PAID_SEARCH_ENABLED=true, каждый запрос проходит через месячный предел расходов.
# Стоимость: X API оплачивается за использование, каждая полученная публикация — платное чтение.
# Одна страница — до 100 публикаций; благодаря since_id следующие запуски получают только новые.

x:
  # Каждый включённый аккаунт — отдельный запрос "from:<handle> -is:retweet"
  # со своим checkpoint (source_key account:<handle>).
  accounts:
    - handle: example_founder
      enabled: true

  # Каждый включённый запрос имеет свой checkpoint (source_key query:<name>).
  # Синтаксис: https://docs.x.com/x-api/posts/search/integrate/build-a-query (до 512 символов).
  queries:
    - name: crypto_predictions
      query: '(crypto OR Solana) (predicts OR says OR promises) lang:en -is:retweet'
      enabled: true

  # Сколько страниц читать по каждому запросу за один сбор (1-10). Повышайте только для узких запросов.
  max_pages_per_query: 1

# RSS/Atom — бесплатно, без ключей. Каждая включённая лента — отдельный источник rss:<name>
# со своим checkpoint (ETag/Last-Modified). name: латиница в нижнем регистре, цифры, _ (до 40).
# Читается только сама лента: без JavaScript, без загрузки страниц статей, до 5 МБ на ответ.
# Адреса лент и их редиректы должны вести в публичный интернет (localhost и частные сети отклоняются).
rss:
  feeds:
    - name: bbc_world
      url: https://feeds.bbci.co.uk/news/world/rss.xml
      enabled: true
    - name: npr_news
      url: https://feeds.npr.org/1001/rss.xml
      enabled: true
    - name: verge          # Atom
      url: https://www.theverge.com/rss/index.xml
      enabled: true
    - name: hn_frontpage
      url: https://hnrss.org/frontpage
      enabled: false

# GDELT Global Quotation Graph настраивается в .env (RADAR_GDELT_*), не здесь.

# Публикации этих авторов (handle или числовой id) всегда отбрасываются.
blocked_authors: []

# Публикации с этими словами или фразами (без учёта регистра) всегда отбрасываются.
blocked_terms:
  - giveaway
  - airdrop

# Отбор (M4): что сохранять, что считать одной историей, что ранжировать. Всё бесплатно и локально.
# Без этой секции действуют значения ниже.
selection:
  # Фильтр до записи: отброшенное не сохраняется, остаются счётчик и небольшой пример
  # (qmemo-radar rejected).
  gate:
    min_words: 5
    min_chars: 25
    max_chars: 5000
    languages: []            # например [English, en]; пусто — любой; без языка — пропускается
    blocked_terms: []
    blocked_domains: []      # домен блокирует и свои поддомены
    min_letter_ratio: 0.6    # доля букв среди непробельных символов
    max_url_age_days: 30     # статья с датой в URL старше — перепечатка старого
    require_topic: false     # true — без совпадения с темой ниже текст отбрасывается
    # template_patterns: свои регулярные выражения вместо встроенных (даты, "click here"...)

  # Темы: слова и фразы целиком, без учёта регистра. Совпадение добавляет вес к значимости.
  topics:
    - name: ai
      terms: [artificial intelligence, openai, chatgpt]
      weight: 5

  # Когда два текста — одна история. При сомнении — раздельно.
  clustering:
    window_hours: 48
    near_duplicate_jaccard: 0.8   # почти дубликат: доля общих значимых слов
    same_event_overlap: 0.9       # то же событие: доля слов короткого текста в длинном
    same_event_min_shared: 4

  preselection:
    min_score: 55                 # ниже — история не ранжируется (0-100, шкала ранжирования)
    always_rank_sources: [x]      # источники, выбранные человеком: без преселекции
    boilerplate_min_mentions: 10  # один сайт повторяет текст на многих страницах — шаблон
    boilerplate_max_domains: 2
